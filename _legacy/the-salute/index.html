<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <title>The Salute — In Honour of Every Soldier</title>
    <meta
      name="description"
      content="A quiet tribute. Walk the valley at dawn, hoist the tricolour, and salute as the sun rises."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='11' y='4' fill='%23ff9933'/%3E%3Crect width='32' height='10' y='15' fill='%23fff'/%3E%3Crect width='32' height='11' y='21' fill='%23138808'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23000080' stroke-width='1.4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Loading -->
    <div id="loader" class="overlay">
      <div class="loader-inner">
        <div class="loader-title">The Salute</div>
        <div class="loader-bar"><i id="loader-fill"></i></div>
        <div class="loader-status" id="loader-status">Preparing the valley…</div>
      </div>
    </div>

    <!-- Title card -->
    <div id="title" class="overlay hidden">
      <div class="title-inner">
        <div class="title-rule"></div>
        <h1>In Honour of Every Soldier</h1>
        <p class="title-sub">Independence Day</p>
        <div class="title-rule"></div>
        <p class="title-cta" id="title-cta">Press any key to begin</p>
      </div>
    </div>

    <!-- In-world prompt -->
    <div id="prompt" class="prompt hidden"><kbd>E</kbd><span id="prompt-text">Hoist the flag</span></div>

    <!-- Movement hint -->
    <div id="hint" class="hint hidden">
      <span class="hint-keys"><kbd>↑</kbd><kbd>↓</kbd> walk</span>
      <span class="dot hint-keys">·</span>
      <span class="hint-keys"><kbd>←</kbd><kbd>→</kbd> turn</span>
      <span class="dot hint-keys">·</span>
      <span class="hint-keys">drag to look</span>
      <span class="dot hint-keys">·</span>
      <span class="hint-keys"><kbd>M</kbd> sound</span>
      <span class="hint-touch">hold the lower screen to walk · drag to look</span>
    </div>

    <!-- Closing caption -->
    <div id="caption" class="caption hidden">
      <p id="caption-line"></p>
    </div>

    <div id="fatal" class="overlay hidden">
      <div class="loader-inner">
        <div class="loader-title">Unable to begin</div>
        <div class="loader-status" id="fatal-msg"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
